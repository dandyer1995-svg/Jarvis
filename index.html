<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="brand">Barney</span>
    <div class="topbar-meta">
      <span class="date-label" id="dateLabel"></span>
      <span class="status-pill" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </span>
    </div>
  </header>

  <main class="layout">

    <section class="panel chat-panel">
      <div class="chat-log" id="chatLog">
        <div class="msg msg-ai">
          <span class="msg-tag">Barney</span>
          <p class="msg-text">Good to see you. Everything's ready — what can I help with?</p>
        </div>
      </div>
      <form class="chat-input-row" id="chatForm">
        <input type="text" id="chatInput" autocomplete="off" placeholder="Message Barney…">
        <button type="button" id="micBtn" class="mic-btn" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </button>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </section>

    <aside class="rail">

      <section class="panel card">
        <div class="card-head">
          <h2>To-do</h2>
          <span class="card-count" id="todoCount"></span>
        </div>
        <ul class="todo-list" id="todoList">
          <li class="todo-empty">Nothing on the list yet.</li>
        </ul>
      </section>

      <section class="panel card card-glow">
        <div class="card-head"><h2>Activity</h2></div>
        <ul class="log-list" id="logList"></ul>
      </section>

      <section class="panel card">
        <div class="card-head"><h2>Environment</h2></div>
        <div class="env-grid">
          <div class="env-row"><span class="env-label">Model</span><span class="env-value" id="envModel">—</span></div>
          <div class="env-row"><span class="env-label">Voice input</span><span class="env-value" id="envVoice">—</span></div>
          <div class="env-row"><span class="env-label">Data</span><span class="env-value" id="envData">—</span></div>
        </div>
      </section>

    </aside>
  </main>
</div>

<script src="assets/js/persona.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
